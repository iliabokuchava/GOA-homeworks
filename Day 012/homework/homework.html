<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classwork</title>
</head>
<body>
<!--ID - ის დახმარებით ჩვენ შეგვიძლია ელემენტს მივანიჭოთ უნიკალური სახელი და მერე ელემენტზე მოვახდინოთ სხვა და სხვა მოქმედებები, მაგალითად ID - ის დახმარებით ჩვენ შეგვიძლია leibel - ი  და ID დავაკავშიროთ-->
<!--Label - არის კონკრეტული შესაყვანი ველის სახელი, რომელიც უკავშირდება input - ს for - ატრიბუტის დახმარებით-->
<form>
    <label for="name1">Enter your name: </label>
    <input type="text" id="name1"><br><br>
    <label for="lastname1">Enter your lastname:</label>
    <input type="text" id="lastname1"><br><br>
    <label for="age1">Enter your age: </label>
    <input type="date" id="age1"><br><br>
    <label for="color1">Enter your color: </label>
    <input type="color" id="color1"><br><br>
    <label for="email1">Enter yout Email: </label>
    <input type="email" id="email1"><br><br>
    <label for="password1">Enter your password: </label>
    <input type="password" id="password1"><br><br>
</form>
</body>
</html>
