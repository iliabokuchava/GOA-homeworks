<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--form - ები შეგვიძლია გამოვიყენოთ რაიმე მოქმედების შესასრულებლად, დაუშვათ საიტზე დასარეგისტრორებლად-->
    <!--id - ატრიბუტი გამოიყენება იმისთვის რომ რაიმე ელემენტს მივანიჭოთ უნიკალური სახელი და შემდეგ გამოვიყენოთ-->
    <form>
        <label for="name1">enter your name: </label>
         <input type="text" id="name1"><br><br>
        <label for="email">enter your email: </label>
        <input type="email" id="email"><br><br>
        <label for="password">enter your password: </label>
        <input type="password" id="password">
    </form>
</body>
</html>
