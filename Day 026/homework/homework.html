<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div h1{
            color: red;
        }
        div p{
            color: blue;
        }
        div i{
            color: blueviolet;
        }
        p u{
            background-color: aqua;
        }
        p i{
            font-size: 40px;
        }
        p strong{
            color: brown;
        }
    </style>
</head>
<body>
    <!--id - Html - ში გამიყენება იმისთვის რომ ელემენტს მივცეთ უნოკალური სახელი, და id - ს აქვს თავისი  გამოყენების წესი: id სახელი არ უნდა იყოს გამოყენებულიერთზე მეტ ელემენტზე-->
    <!--class - Html - ში გამოიყენება იმისთვის რომ ელემენტები დავაჯგუფოთ ერთი class სახელით, class - საც აქვს თავისი გამოყენების წესი, და ეს წესია: class - ის გამოყენება შეიძლება ბევრ ელემენტზე გამოყენება-->
    <!--განსხვავებაა id და class შიიმაში რომ id - ის გამოყენება ერთ მინიჭებული სახელით შეიძლიება მარტო ერთელემენტზე, და class - ის გამოყენება ერთი სახელით შეიძლება უამრავ ელემენტზე-->

    <!--edscedant selector - გამოიყენება იმისთვის რომ ე.წ. მშობელ ელემენტში მყოფი კონკრეტული შვილი ელემენტი გავსტილოთ-->
    <div>
        <h1>GOA</h1>
        <p>GOA</p>
        <i>GOA</i>
    </div>
    <!--style inheritance - ან მემკვიდრეობითი გასტილვა html - ში გამოიყენება იმისთვის რომ მშობელი ელემენტის დახმარებით გავსტილოთ შვილი ელემენტი-->
    <p><u>ბატონი გიორგი ნარინდოშვილი</u></p>
    <p><i>დათა ბოჭორიშვილი</i></p>
    <p><strong>ილია ბოკუჩავა</strong></p>
</body>
</html>
