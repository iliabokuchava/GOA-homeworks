<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        #div1{
            background-color: rgb(169, 223, 255);
            text-align: center;
            color: rgb(0, 0, 110);
            border: 2px solid rgb(0, 0, 110);
        }
        #div1 h1{
            font-size: 35px;
        }
        #div1 p{
            font-size: 20px;
        }
        #div2 {
            border: 2px solid gray; text-align: center;
        }
        #div2 h1{
            color: rgb(78, 4, 147); text-align: center;
        }
        #div2 p{
            text-align: center;
        }
        #div2 button{
            background-color: blueviolet; border: 2px solid rgb(42, 0, 82);
        }
        footer {
            text-align: center; border: 2px solid black; background-color: pink;
        }
    </style>
</head>
<body>
    <header>
        <div id="div1">
            <h1>My Simple Web Page</h1>
            <p>Just a beginner-friendly desing!</p>
        </div><br>
    </header>
    <main>
        <div id="div2">
            <h1>Welcome!</h1>
            <p>This is a simple webpage made witch basic HTMl and CSS. It uses only beginner-friendly<br>
                propertise like color, background-color, border, margin, padding, and font-size</p>
            <button>
                Learn More
            </button>
        </div>
    </main><br>
    <footer>
        <p>@ 2026 My Siple webpage</p>
    </footer>
</body>
</html>
